<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PLC Knowledge — Mitsubishi FX Wiki</title>
<style>
:root{--bg:#0b1020;--panel:#121a2d;--panel2:#18233a;--text:#eaf0ff;--muted:#9aa9c5;--accent:#55d6be;--accent2:#7aa7ff;--line:#263653;--warn:#ffc857}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif;line-height:1.6}
header{position:sticky;top:0;z-index:5;background:rgba(11,16,32,.95);border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}
.top{max-width:1400px;margin:auto;padding:14px 20px;display:flex;gap:18px;align-items:center}.brand{font-weight:800;font-size:20px;white-space:nowrap}.brand span{color:var(--accent)}
.search{flex:1;max-width:650px}.search input{width:100%;padding:12px 15px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);outline:none}
.layout{max-width:1400px;margin:auto;display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - 66px)}
aside{border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:66px;height:calc(100vh - 66px);overflow:auto}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--muted);padding:9px 12px;border-radius:8px;cursor:pointer;font-size:14px}nav button:hover,nav button.active{background:var(--panel2);color:var(--text)}
main{padding:30px 38px;min-width:0}.hero{background:linear-gradient(135deg,#15243e,#10182b);border:1px solid var(--line);border-radius:18px;padding:32px;margin-bottom:24px}.hero h1{font-size:38px;margin:0 0 8px}.hero p{color:var(--muted);max-width:850px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:18px;cursor:pointer}.card:hover{border-color:#3c5b88}.card h3{margin:0 0 6px}.card p{margin:0;color:var(--muted);font-size:14px}
.section{margin:28px 0}.section h2{border-bottom:1px solid var(--line);padding-bottom:9px}.tag{display:inline-block;padding:3px 8px;border:1px solid var(--line);border-radius:999px;color:var(--accent);font-size:12px;margin:2px}
pre{background:#080d18;border:1px solid var(--line);padding:15px;border-radius:10px;overflow:auto;color:#dce7ff}.ladder{font-family:monospace;white-space:pre;background:#fff;color:#111;border-radius:8px;padding:15px;overflow:auto}
table{width:100%;border-collapse:collapse;background:var(--panel);border-radius:10px;overflow:hidden}th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--accent)}
.notice{border-left:4px solid var(--warn);background:#211d12;padding:12px 15px;margin:15px 0}.muted{color:var(--muted)}.back{margin-bottom:18px;color:var(--accent);cursor:pointer}.result{padding:12px;border-bottom:1px solid var(--line);cursor:pointer}.result:hover{background:var(--panel2)}
footer{color:var(--muted);padding:35px 0;border-top:1px solid var(--line);margin-top:50px}
@media(max-width:850px){.layout{grid-template-columns:1fr}aside{position:relative;top:0;height:auto;border-right:0;border-bottom:1px solid var(--line)}main{padding:20px}.hero h1{font-size:29px}.top{flex-wrap:wrap}.search{order:3;flex-basis:100%}}

/* Dictionary V3 */
.dict-toolbar{display:grid;grid-template-columns:minmax(260px,1fr) 220px 140px;gap:10px;margin:16px 0}
.dict-search{display:flex;align-items:center;gap:8px;background:var(--card,#fff);border:1px solid var(--border,#d9dee7);border-radius:12px;padding:0 12px}
.dict-search input{border:0;outline:0;background:transparent;width:100%;padding:12px 4px;font-size:14px}
.dict-toolbar select{border:1px solid var(--border,#d9dee7);border-radius:12px;padding:0 12px;background:var(--card,#fff);font-size:14px}
.dict-summary{margin:8px 0 12px;color:var(--muted,#667085);font-size:13px}
.table-wrap{overflow:auto;border:1px solid var(--border,#d9dee7);border-radius:14px;background:var(--card,#fff)}
.dict-table{width:100%;border-collapse:collapse;min-width:850px}
.dict-table th,.dict-table td{padding:11px 12px;border-bottom:1px solid var(--border,#edf0f4);text-align:left;vertical-align:middle}
.dict-table th{position:sticky;top:0;background:var(--card,#fff);z-index:1;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted,#667085)}
.dict-table tr:hover td{background:rgba(80,120,255,.035)}
.mnemonic-btn{border:0;background:transparent;padding:0;font-weight:700;cursor:pointer;color:var(--accent,#315efb);font-family:inherit;font-size:14px}
.mnemonic-btn:hover{text-decoration:underline}
.group-pill{display:inline-block;padding:4px 8px;border-radius:999px;background:rgba(80,120,255,.08);font-size:12px;white-space:nowrap}
.detail-btn{border:1px solid var(--border,#d9dee7);background:var(--card,#fff);border-radius:8px;padding:6px 9px;cursor:pointer;white-space:nowrap}
.empty-row{text-align:center!important;padding:30px!important;color:var(--muted,#667085)}
@media(max-width:760px){.dict-toolbar{grid-template-columns:1fr}}

/* GX Works2-like Ladder screenshots */
.ladder-shot{margin:14px 0 22px;border:1px solid #bfc5cc;border-radius:7px;overflow:hidden;background:#f4f5f6;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.ladder-shot-title{height:34px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;background:#e7e9ec;border-bottom:1px solid #bfc5cc;font-size:12px;color:#30343b;font-weight:600}
.ladder-svg{display:block;width:100%;height:auto;background:#fff}
.gx-bg{fill:#fff}
.rail{stroke:#1d1f23;stroke-width:3}
.wire{stroke:#222;stroke-width:2}
.addr{font:12px Arial;fill:#6c737a}
.contact{font:34px monospace;fill:#111}
.device{font:16px Consolas,monospace;fill:#111}
.block{font:17px Consolas,monospace;font-weight:600;fill:#111}
.coil{font:17px Consolas,monospace;fill:#111}
.caption{font:12px Arial;fill:#687078}
.ladder-content text{dominant-baseline:middle}

/* Real GX Works2 screenshots */
.real-ladder-shot{margin:16px 0 24px;border:1px solid #c5cbd2;border-radius:8px;overflow:hidden;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.07)}
.real-ladder-title{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;background:#eceef0;border-bottom:1px solid #c5cbd2;font-size:12px;font-weight:600;color:#333}
.real-ladder-shot img{display:block;width:100%;height:auto;background:#fff}
.real-ladder-caption{padding:9px 12px;font-size:13px;color:#5f6872;border-top:1px solid #e5e7eb}

.command-diagram{margin:14px 0 22px;border:1px solid #c5cbd2;border-radius:8px;overflow:hidden;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.command-diagram-head{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;background:#eef0f2;border-bottom:1px solid #c5cbd2;font-size:12px;color:#30343b}
.command-svg{display:block;width:100%;height:auto}.svg-bg{fill:#fff}.svg-rail{stroke:#17191c;stroke-width:3}.svg-wire{stroke:#222;stroke-width:2}.svg-address{font:12px Arial;fill:#69717a}.svg-desc{font:12px Arial;fill:#66717a}.svg-code{font:15px Consolas,monospace;font-weight:600;fill:#202328}.command-svg .contact{font:34px Consolas,monospace;fill:#111}.command-svg .device{font:16px Consolas,monospace;fill:#111}.command-svg .block{font:17px Consolas,monospace;font-weight:600;fill:#111}

/* Detailed Ladder lessons */
.lesson{background:var(--card,#111827);border:1px solid var(--border,#26354f);border-radius:16px;margin:18px 0;overflow:hidden}
.lesson-head{padding:18px 20px;background:rgba(255,255,255,.025);border-bottom:1px solid var(--border,#26354f)}
.lesson-head h3{margin:0 0 7px}.lesson-head p{margin:0;color:var(--muted,#aab4c4)}
.lesson-body{padding:20px}.lesson-body h4{margin:20px 0 8px}.lesson-body ul,.lesson-body ol{line-height:1.8}
.lesson-image{margin:16px 0;border:1px solid #3a4658;border-radius:9px;overflow:hidden;background:#fff}
.lesson-image-title{display:flex;justify-content:space-between;padding:9px 12px;background:#e9ecef;color:#252a30;font-size:12px}
.lesson-svg{display:block;width:100%;height:auto}.lesson-bg{fill:#fff}.lesson-rail{stroke:#111;stroke-width:3}.lesson-wire{stroke:#111;stroke-width:2}
.lesson-addr{font:12px Arial;fill:#69717a}.lesson-contact{font:34px Consolas,monospace;fill:#111}.lesson-dev{font:15px Consolas,monospace;fill:#111}.lesson-coil{font:18px Consolas,monospace;font-weight:600;fill:#111}.lesson-block{font:17px Consolas,monospace;font-weight:700;fill:#111}.lesson-note{font:13px Arial;fill:#4b5563}
.lesson-code{background:#080d16;color:#dbe5f5;border:1px solid #29354a;border-radius:10px;padding:14px;overflow:auto;line-height:1.6}
.lesson-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.lesson-box{padding:14px;border:1px solid #29354a;border-radius:10px;background:rgba(255,255,255,.02)}
@media(max-width:760px){.lesson-grid{grid-template-columns:1fr}}

/* === Unified learning standard === */
.topic-hero{padding:20px;border:1px solid var(--border,#29354a);border-radius:16px;background:linear-gradient(135deg,rgba(50,100,200,.10),rgba(255,255,255,.02));margin-bottom:18px}
.topic-hero h2{margin:0 0 8px}.topic-hero p{margin:0;color:var(--muted,#aab4c4);line-height:1.65}
.learning-section{margin:18px 0}.learning-section h3{margin-bottom:9px}
.learning-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.learning-box{border:1px solid var(--border,#29354a);border-radius:12px;padding:14px;background:rgba(255,255,255,.02);line-height:1.65}
.learning-box b{display:block;margin-bottom:4px}
.code-box{background:#080d16;color:#dbe5f5;border:1px solid #29354a;border-radius:10px;padding:14px;overflow:auto;line-height:1.65}
.result-box{border-left:4px solid #4b8cff;padding:12px 15px;background:rgba(75,140,255,.07);border-radius:8px}
.error-box{border-left:4px solid #e6a23c;padding:12px 15px;background:rgba(230,162,60,.07);border-radius:8px}
.practice-box{border:1px dashed #52627a;border-radius:12px;padding:15px;margin-top:12px}
.step-list{line-height:1.8}
@media(max-width:760px){.learning-grid{grid-template-columns:1fr}}

.verified-badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#e7f6ec;color:#216e39;font-size:12px;font-weight:700}

.structure-intro{
  background:#f8fafc;
  border:1px solid #dbe2ea;
  border-radius:14px;
  padding:18px 20px;
  margin-bottom:18px;
}
.structure-intro h2{margin-top:0}
.source-note{
  margin-bottom:0;
  padding:10px 12px;
  background:#fff8e8;
  border-left:4px solid #d99a2b;
  border-radius:6px;
}
.structure-toolbar{
  display:grid;
  grid-template-columns:minmax(220px,1fr) 220px 120px;
  gap:10px;
  margin:16px 0;
}
.structure-toolbar input,
.structure-toolbar select{
  padding:11px 12px;
  border:1px solid #cbd5e1;
  border-radius:9px;
  background:#fff;
}
.structure-card{
  background:#fff;
  border:1px solid #d8dee7;
  border-radius:14px;
  margin:16px 0;
  overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.04);
}
.structure-card-head{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:14px 18px;
  background:#eef2f6;
  border-bottom:1px solid #d8dee7;
}
.structure-card-head h3{margin:7px 0 0;font-size:22px}
.structure-card-head h3 small{
  font-size:14px;
  font-weight:400;
  color:#64748b;
}
.structure-kind,.structure-fnc,.structure-page{
  display:inline-block;
  padding:4px 8px;
  margin-right:5px;
  border-radius:6px;
  font-size:12px;
  background:#e2e8f0;
}
.structure-fnc{font-family:monospace}
.structure-page{margin-right:0;background:#fff}
.structure-grid{
  display:grid;
  grid-template-columns:minmax(260px,1fr) minmax(360px,1.25fr);
  gap:18px;
  padding:18px;
}
.structure-label{
  font-size:12px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.04em;
  color:#64748b;
  margin:8px 0;
}
.structure-code{
  margin:0 0 14px;
  padding:12px;
  background:#111827;
  color:#f8fafc;
  border-radius:9px;
  overflow:auto;
  white-space:pre-wrap;
  font-family:Consolas,monospace;
}
.structure-figure{
  margin:0;
  padding:10px;
  border:1px solid #dbe2ea;
  border-radius:10px;
  background:#f8fafc;
}
.structure-figure img{
  width:100%;
  display:block;
  height:auto;
}
.structure-figure figcaption{
  padding:8px 4px 2px;
  font-size:12px;
  color:#64748b;
}
.empty-state{
  padding:30px;
  text-align:center;
  background:#f8fafc;
  border-radius:10px;
}
@media(max-width:800px){
  .structure-toolbar{grid-template-columns:1fr}
  .structure-grid{grid-template-columns:1fr}
}

</style>
</head>
<body>
<header><div class="top"><div class="brand">⚙ <span>PLC</span> Knowledge</div><div class="search"><input id="search" placeholder="🔎 Tìm lệnh, device, bài học, ví dụ..."></div></div></header>
<div class="layout">
<aside><nav id="nav"></nav></aside>
<main id="app"></main>
</div>
<script>
const sections=[

];

const devices=[
["X","Input","Bit","Đọc trạng thái thiết bị đầu vào"],["Y","Output","Bit","Điều khiển ngõ ra"],["M","Auxiliary Relay","Bit","Relay nội bộ"],["S","State Relay","Bit","Điều khiển trình tự/step"],["T","Timer","Bit/Word","Timer và giá trị hiện tại"],["C","Counter","Bit/Word","Bộ đếm"],["D","Data Register","Word","Lưu và xử lý dữ liệu"],["R","File Register","Word","Lưu dữ liệu theo vùng file"],["Z/V","Index Register","Word","Định địa chỉ gián tiếp/index"],["P","Pointer","Program","Con trỏ nhảy/call"],["K","Decimal Constant","Constant","Hằng số thập phân"],["H","Hex Constant","Constant","Hằng số hexadecimal"]

["INV","Basic","INV","Đảo trạng thái logic của kết quả."],

const richExamples={
"LD":{title:"LD — Load",syntax:"LD X0\nOUT Y0",explain:["LD X0: đọc trạng thái X0 như điều kiện đầu tiên của rung.","OUT Y0: xuất kết quả logic ra Y0.","Khi X0 ON → rung đúng → Y0 ON. Khi X0 OFF → Y0 OFF."],result:"X0 = ON ⇒ Y0 = ON",use:"Điều khiển một output trực tiếp từ một input."},

"ORI":{title:"ORI — OR Inverse",syntax:"LD X0\nORI X1\nOUT Y0",explain:["Điều kiện X0 hoặc phủ định X1.","Nếu X0 ON hoặc X1 OFF thì rung đúng."],result:"X0 OR NOT X1 ⇒ Y0",use:"Các điều kiện OR có tiếp điểm thường đóng."},
"OUT":{title:"OUT — Output",syntax:"LD X0\nOUT Y0",explain:["OUT Y0 ghi kết quả logic hiện tại vào Y0.","OUT không phải lệnh giữ trạng thái kiểu SET; Y0 sẽ được cập nhật theo logic rung."],result:"Logic rung = 1 ⇒ Y0 ON",use:"Điều khiển output hoặc một device bit trong chương trình."},
"SET":{title:"SET — Set giữ trạng thái",syntax:"LD X0\nSET M0\n\nLD X1\nRST M0\n\nLD M0\nOUT Y0",explain:["X0 ON → SET M0 làm M0 ON và giữ ON.","M0 không tự OFF khi X0 OFF.","X1 ON → RST M0 làm M0 OFF.","Y0 phản ánh trạng thái M0."],result:"Nhấn X0 → M0/Y0 giữ ON; nhấn X1 → OFF.",use:"Start/Stop, latch, trạng thái máy."},
"RST":{title:"RST — Reset",syntax:"LD X1\nRST M0",explain:["Khi X1 ON, RST M0 đưa M0 về OFF.","RST cũng được dùng để reset counter hoặc timer loại phù hợp."],result:"X1 ON ⇒ M0 OFF",use:"Nút Stop, reset trạng thái, reset counter/timer."},
"PLS":{title:"PLS — Pulse Rising",syntax:"LD X0\nPLS M0\n\nLD M0\nSET Y0",explain:["PLS phát một xung rất ngắn khi điều kiện X0 chuyển OFF → ON.","M0 chỉ ON trong một scan theo cơ chế xung.","Có thể dùng xung này để kích hoạt một hành động đúng một lần."],result:"Mỗi lần nhấn X0 → M0 có một xung.",use:"One-shot, đếm một lần, chuyển step."},
"PLF":{title:"PLF — Pulse Falling",syntax:"LD X0\nPLF M0",explain:["PLF tạo xung khi X0 chuyển ON → OFF.","Khác PLS ở cạnh tác động."],result:"Nhả X0 → M0 có một xung.",use:"Phát hiện sự kiện khi nhả nút hoặc tín hiệu mất."},
"INV":{title:"INV — Invert",syntax:"LD X0\nINV\nOUT Y0",explain:["INV đảo kết quả logic trước đó.","Nếu kết quả trước INV là 1 thì sau INV là 0 và ngược lại."],result:"Y0 = NOT X0",use:"Đảo logic mà không cần đổi kiểu tiếp điểm."},
"MOV":{title:"MOV — Move",syntax:"MOV K100 D0\nMOV D0 D10",explain:["MOV K100 D0: ghi hằng số 100 vào D0.","MOV D0 D10: sao chép giá trị hiện tại của D0 sang D10.","MOV không phải phép cộng; nó truyền dữ liệu từ nguồn sang đích."],result:"D0 = 100 và D10 = 100",use:"Gán giá trị, copy dữ liệu, khởi tạo thanh ghi."},
"BMOV":{title:"BMOV — Block Move",syntax:"BMOV D0 D10 K5",explain:["Nguồn bắt đầu tại D0.","Đích bắt đầu tại D10.","K5 chỉ định số lượng word được chuyển theo cú pháp của instruction."],result:"Một vùng dữ liệu D0... được sao chép sang D10...",use:"Copy bảng dữ liệu hoặc nhiều thanh ghi."},
"FMOV":{title:"FMOV — Fill Move",syntax:"FMOV K0 D0 K10",explain:["K0 là giá trị muốn ghi.","D0 là vị trí bắt đầu.","K10 là số lượng word cần ghi theo cú pháp instruction."],result:"Một vùng D được điền cùng giá trị 0.",use:"Xóa/khởi tạo một vùng dữ liệu."},
"CMP":{title:"CMP — Compare",syntax:"CMP D0 K100 M0",explain:["So sánh giá trị D0 với K100.","Các bit kết quả liên quan được điều khiển bắt đầu từ M0.","Tùy quan hệ >, =, < mà các bit kết quả tương ứng ON."],result:"D0 được so sánh với 100.",use:"Điều khiển theo giá trị đo, tốc độ, số lượng."},
"ZCP":{title:"ZCP — Zone Compare",syntax:"ZCP K0 D0 K100 M0",explain:["So sánh D0 với vùng từ 0 đến 100.","Kết quả được đưa ra vùng bit bắt đầu tại M0.","Rất hữu ích để chia giá trị thành các vùng thấp/trong vùng/cao."],result:"Biết D0 đang thấp hơn, nằm trong hoặc cao hơn vùng.",use:"Phân loại nhiệt độ, tốc độ, mức, sản lượng."},
"ADD":{title:"ADD — Addition",syntax:"ADD D0 D1 D2",explain:["Lấy D0 + D1.","Kết quả ghi vào D2."],result:"Nếu D0=100, D1=25 → D2=125.",use:"Cộng sản lượng, offset, giá trị cảm biến."},
"SUB":{title:"SUB — Subtraction",syntax:"SUB D0 D1 D2",explain:["Lấy D0 - D1.","Kết quả ghi vào D2."],result:"Nếu D0=100, D1=25 → D2=75.",use:"Tính chênh lệch, số lượng còn lại."},
"MUL":{title:"MUL — Multiplication",syntax:"MUL D0 D1 D2",explain:["Nhân D0 với D1.","Kết quả được lưu theo quy tắc độ rộng dữ liệu của instruction/model."],result:"D0=10, D1=20 → kết quả 200.",use:"Tính đơn giá × số lượng, hệ số."},
"DIV":{title:"DIV — Division",syntax:"DIV D0 D1 D2",explain:["Chia D0 cho D1.","Cần chú ý trường hợp mẫu số bằng 0 và độ rộng dữ liệu."],result:"D0=100, D1=4 → kết quả 25.",use:"Tính trung bình, tốc độ, tỷ lệ."},
"INC":{title:"INC — Increment",syntax:"INC D0",explain:["Mỗi lần instruction được thực thi, giá trị D0 tăng theo đơn vị của instruction.","Nếu rung giữ ON liên tục, cần hiểu cơ chế thực thi/scan để tránh tăng ngoài ý muốn."],result:"D0 tăng từng bước.",use:"Đếm phần mềm, tạo index."},
"DEC":{title:"DEC — Decrement",syntax:"DEC D0",explain:["Giảm giá trị D0 theo đơn vị của instruction.","Cần kiểm soát điều kiện kích hoạt để tránh giảm liên tục mỗi scan."],result:"D0 giảm từng bước.",use:"Đếm ngược, số lượng còn lại."},
"BCD":{title:"BCD — Binary to BCD",syntax:"BCD D0 D10",explain:["Chuyển giá trị nguồn sang dạng BCD theo quy tắc instruction.","Thường dùng khi đưa số sang thiết bị hiển thị cần BCD."],result:"D10 chứa dạng BCD tương ứng.",use:"Seven-segment/thiết bị hiển thị."},
"BIN":{title:"BIN — BCD to Binary",syntax:"BIN D0 D10",explain:["Chuyển dữ liệu BCD về dạng binary để PLC xử lý số học."],result:"D10 chứa giá trị binary.",use:"Đưa dữ liệu hiển thị về dạng số để tính toán."},
"SFT":{title:"SFT — Shift Register",syntax:"LD X0\nSFT M0 K8",explain:["SFT dịch dữ liệu bit theo cấu hình.","Dùng để tạo chuỗi trạng thái hoặc LED chạy."],result:"Các bit trong vùng M được dịch theo mỗi lần kích.",use:"Tracking sản phẩm, LED chạy, shift register."},
"SPD":{title:"SPD — Speed Detection",syntax:"SPD X0 D0 K100",explain:["Đo tần số/tốc độ xung từ input theo cấu hình.","Kết quả được đưa vào vùng dữ liệu phù hợp."],result:"Dữ liệu tốc độ được PLC cập nhật.",use:"Đo tốc độ encoder/băng tải."},
"PLSY":{title:"PLSY — Pulse Output",syntax:"PLSY K1000 K100 Y0",explain:["Tạo chuỗi xung tại output transistor phù hợp.","Tham số quy định tần số/số xung theo cú pháp và model.","Phải kiểm tra giới hạn output và phần cứng trước khi dùng cho servo/stepper."],result:"Y0 phát xung theo tham số.",use:"Điều khiển stepper/servo."},
"PWM":{title:"PWM — Pulse Width Modulation",syntax:"PWM K100 K50 Y0",explain:["Tạo tín hiệu PWM.","Các tham số xác định chu kỳ và độ rộng xung theo instruction."],result:"Y0 phát PWM.",use:"Điều khiển công suất hoặc tín hiệu cần duty cycle."},
"PLSR":{title:"PLSR — Pulse with Accel/Decel",syntax:"PLSR ... Y0",explain:["Dùng cho phát xung có đặc tính tăng/giảm tốc theo tham số.","Cú pháp và giới hạn phụ thuộc dòng PLC/output."],result:"Phát xung phục vụ positioning.",use:"Stepper/servo positioning."},
"DRVI/DRVA":{title:"DRVI / DRVA — Positioning",syntax:"DRVI ...\nDRVA ...",explain:["DRVI thường dùng cho di chuyển tương đối; DRVA cho vị trí tuyệt đối theo cách Mitsubishi định nghĩa.","Cần cấu hình đúng output pulse, đơn vị, tốc độ và giới hạn."],result:"PLC phát lệnh chuyển động.",use:"Điều khiển trục servo/stepper."},
"PID":{title:"PID — PID Control",syntax:"PID ...",explain:["Dùng thuật toán PID để điều khiển biến quá trình.","Cần xác định PV, SV, MV và tham số P/I/D phù hợp."],result:"PLC tính tín hiệu điều khiển theo sai lệch.",use:"Nhiệt độ, áp suất, lưu lượng, mức."}
};

const extraExamples={

"ROR/ROL":{syntax:"ROR D0 K1",explain:["ROR xoay các bit sang phải.","Bit bị đẩy ra được quay trở lại đầu word theo cơ chế instruction."],result:"Bit pattern của D0 được xoay một vị trí.",use:"Mã hóa/giải mã bit, vòng bit."},
"ENCO/DECO":{syntax:"ENCO D0 D10",explain:["ENCO mã hóa vị trí bit theo quy tắc instruction.","DECO thực hiện chiều ngược lại để giải mã giá trị thành bit."],result:"Chuyển đổi giữa vị trí bit và dữ liệu mã hóa.",use:"Chọn kênh, chọn output, decoder."},
"SUM/MEAN":{syntax:"SUM D0 D9 D20",explain:["SUM tính tổng vùng dữ liệu theo cú pháp instruction.","MEAN tính giá trị trung bình của vùng dữ liệu."],result:"Dữ liệu thống kê được đưa vào vùng đích.",use:"Tính tổng sản lượng, trung bình cảm biến."},
"TCMP/TZCP":{syntax:"TCMP ...\nTZCP ...",explain:["TCMP so sánh thời gian thực với giá trị đặt.","TZCP kiểm tra thời gian nằm trong vùng."],result:"Bit kết quả cho biết quan hệ thời gian.",use:"Lịch chạy máy, ca sản xuất."},
"STR/VAL/LEN":{syntax:"LEN ...",explain:["LEN lấy độ dài chuỗi theo cú pháp instruction.","STR/VAL hỗ trợ chuyển đổi dữ liệu và chuỗi theo nhóm lệnh."],result:"PLC có thể xử lý dữ liệu ký tự.",use:"Barcode, mã sản phẩm, giao tiếp thiết bị."}
};

 "D2 = D0 - D1."]], "MUL": [["Ví dụ — Thành tiền", "MUL D0 D1 D2", "D2 nhận kết quả nhân theo kiểu dữ liệu của instruction."]], "DIV": [["Ví dụ — Tỷ lệ", "DIV D0 D1 D2", "D2 nhận thương theo kiểu dữ liệu; phải kiểm tra trường hợp D1=0."]], "SFT": [["Ví dụ — LED chạy", "LD X0\nSFT M0 K8", "Khi kích theo cơ chế phù hợp, bit được dịch trong vùng M; ứng dụng LED/sequence."]], "PLSY": [["Ví dụ — Phát xung", "PLSY K1000 K100 Y0", "Y0 phát xung theo tham số; cần kiểm tra output transistor và giới hạn model."]], "DRVI": [["Ví dụ — Di chuyển tương đối", "DRVI ...", "Dùng khi cần điều khiển chuyển động theo lượng dịch chuyển tương đối."]], "DRVA": [["Ví dụ — Vị trí tuyệt đối", "DRVA ...", "Dùng khi cần đưa trục đến vị trí tuyệt đối theo cấu hình positioning."]], "PID": [["Ví dụ — Điều khiển nhiệt độ", "PID ...", "PV là nhiệt độ đo, SV là nhiệt độ đặt, MV là tín hiệu điều khiển; cần tune tham số."]]};
const verifiedSyntax={"CMP":["CMP D0 K100 M0","D0 và K100 được so sánh; M0, M1, M2 lần lượt nhận trạng thái >, =, < theo CMP.","D0=120 → M0 ON; D0=100 → M1 ON; D0=80 → M2 ON."],"ZCP":["ZCP K0 K100 D0 M0","K0 là cận dưới, K100 là cận trên, D0 là giá trị so sánh; M0/M1/M2 biểu diễn thấp/trong vùng/cao.","D0=50 → M1 ON; D0<0 → M0 ON; D0>100 → M2 ON."],"MOV":["MOV K100 D0","K100 là source; D0 là destination. Khi rung được thực thi, D0 nhận 100.","D0 = 100."],"BMOV":["BMOV D0 D10 K5","Copy 5 word bắt đầu từ D0 sang vùng bắt đầu D10.","D0..D4 → D10..D14."],"FMOV":["FMOV K0 D0 K10","Ghi cùng giá trị K0 vào 10 word bắt đầu tại D0.","D0..D9 = 0."],"XCH":["XCH D0 D10","Trao đổi nội dung D0 và D10. XCH chỉ hỗ trợ ở các dòng PLC phù hợp.","D0 và D10 đổi giá trị cho nhau."],"BCD":["BCD D0 D10","Chuyển giá trị binary nguồn sang BCD tại destination.","D10 chứa dữ liệu BCD tương ứng."],"BIN":["BIN D0 D10","Chuyển dữ liệu BCD nguồn về binary tại destination.","D10 chứa binary tương ứng."],"ADD":["ADD D0 D1 D2","D2 = D0 + D1 trong phép toán 16-bit; instruction có biến thể 32-bit DADD.","D0=100, D1=25 → D2=125."],"SUB":["SUB D0 D1 D2","D2 = D0 - D1; có biến thể 32-bit DSUB.","D0=100, D1=25 → D2=75."],"MUL":["MUL D0 D1 D2","16-bit MUL cho kết quả 32-bit tại D2,D3; biến thể 32-bit là DMUL.","D0=10, D1=20 → D2/D3 chứa 200 theo định dạng 32-bit."],"DIV":["DIV D0 D1 D2","16-bit DIV lưu quotient tại D2 và remainder tại D3; biến thể 32-bit là DDIV.","100 ÷ 4 → quotient 25, remainder 0."],"INC":["INC D0","Tăng D0 theo một đơn vị khi instruction thực thi.","D0=9 → 10."],"DEC":["DEC D0","Giảm D0 theo một đơn vị khi instruction thực thi.","D0=9 → 8."],"WAND":["WAND D0 D1 D2","AND từng bit của D0 và D1, kết quả vào D2.","D2 = D0 AND D1."],"WOR":["WOR D0 D1 D2","OR từng bit của D0 và D1, kết quả vào D2.","D2 = D0 OR D1."],"WXOR":["WXOR D0 D1 D2","XOR từng bit của D0 và D1, kết quả vào D2.","D2 = D0 XOR D1."],"NEG":["NEG D0","Đổi dấu dữ liệu theo quy tắc của instruction.","D0 dương → giá trị âm tương ứng."],"ROR":["ROR D0 K1","Xoay bit của D0 sang phải 1 bit; bit cuối được đưa vòng lại đầu.","Mẫu bit D0 được rotate phải."],"ROL":["ROL D0 K1","Xoay bit của D0 sang trái 1 bit.","Mẫu bit D0 được rotate trái."],"SFTR":["SFTR M0 M10 K8 K1","S là bit nguồn đầu, D là đầu vùng shift, K8 là độ dài vùng, K1 là số bit dịch.","Dữ liệu bit được dịch phải theo cấu hình."],"SFTL":["SFTL M0 S0 K8 K1","S là bit nguồn, D là đầu vùng shift, K8 là độ dài vùng, K1 là số bit dịch.","Dữ liệu bit được dịch trái theo cấu hình."],"SUM":["SUM D0 D10","Đếm số bit ON trong D0 và ghi số lượng vào D10.","Nếu D0 có 9 bit ON → D10=9."],"PLSY":["PLSY K1000 K200 Y0","S1=1000 Hz, S2=200 pulses, D=Y0. Manual quy định output phải là output transistor/high-speed phù hợp.","Y0 phát 200 xung ở 1000 Hz."],"PWM":["PWM K50 K100 Y0","S1=50 ms là pulse width, S2=100 ms là period, D=Y0; cần S1≤S2 và output phù hợp.","Y0 phát PWM 50 ms ON trong chu kỳ 100 ms."],"PLSR":["PLSR K1000 K2000 K500 Y0","S1=maximum frequency, S2=total pulses, S3=acc/dec time, D=output Y.","Y0 phát 2000 xung, có tăng/giảm tốc theo tham số."],"SPD":["SPD X0 K100 D0","S1=X0 là input xung; S2=thời gian đo; D0 là vùng kết quả.","PLC đo mật độ/tốc độ xung trong khoảng thời gian chỉ định."],"DRVI":["DRVI K1000 K500 Y0 M0","S1=số xung tương đối, S2=tần số xung, D1=output pulse, D2=output hướng.","Trục chạy tương đối theo số xung và tốc độ."],"DRVA":["DRVA K10000 K500 Y0 M0","S1=vị trí tuyệt đối, S2=tần số xung, D1=output pulse, D2=output hướng.","Trục chạy đến vị trí tuyệt đối theo cấu hình."],"PID":["PID D0 D100 D200 D300","S1=D0 chứa SV, S2=D100 chứa PV, S3=D200 là vùng parameter, D300 chứa MV.","PLC tính MV theo PID tại chu kỳ sampling."],"ALT":["ALT Y0","ALT đảo trạng thái bit đích. Khi dùng ALT liên tục, đích có thể đảo mỗi operation cycle; để đảo theo cạnh dùng ALTP hoặc tiếp điểm pulse.","Mỗi lần kích hoạt đúng cạnh → Y0 đổi ON/OFF."]};

function nav(){
document.getElementById("nav").innerHTML=sections.map(([id,n])=>`<button data-page="${id}">${n}</button>`).join("");
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>show(b.dataset.page));
}
function esc(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function layout(title,body){return `<div class="back" onclick="show('home')">← Trang chủ</div><h1>${title}</h1>${body}<footer>PLC Knowledge V14 — thư viện học tập cá nhân. Nội dung được tổ chức lại để học và tra cứu; khi dùng trong dự án thực tế hãy đối chiếu manual đúng model PLC.</footer>`}
function cards(arr){return `<div class="grid">${arr.map(x=>`<div class="card" onclick="show('${x[0]}')"><h3>${x[1]}</h3><p>${x[2]||""}</p></div>`).join("")}</div>`}

function structurePage(){
  const groups=[...new Set(sourceStructure.map(x=>x.kind))];
  return layout("🧱 Cấu trúc lệnh",`
    <div class="structure-intro">
      <h2>Cấu trúc lệnh — lấy trực tiếp từ tài liệu nguồn</h2>
      <p>
        Mục này tổng hợp các lệnh và cấu trúc/symbol được thể hiện trong tài liệu
        <b>FX3S/FX3G/FX3GC/FX3U/FX3UC Series — Programming Manual - Basic & Applied Instruction Edition</b>.
        Mỗi mục có hình minh họa được cắt trực tiếp từ bảng lệnh trong PDF.
      </p>
      <p class="source-note">
        Lưu ý: file nguồn này là phần <b>Instruction List</b>, nên hình minh họa là symbol/cấu trúc lệnh trong bảng tài liệu;
        đây không phải là ví dụ ứng dụng hoàn chỉnh cho từng lệnh.
      </p>
    </div>

    <div class="structure-toolbar">
      <input id="structureSearch" placeholder="Tìm LD, MOV, FNC20, ADD, Timer...">
      <select id="structureGroup">
        <option value="">Tất cả nhóm</option>
        ${groups.map(g=>`<option value="${esc(g)}">${esc(g)}</option>`).join("")}
      </select>
      <select id="structureLimit">
        <option value="all">Tất cả</option>
        <option value="25">25</option>
        <option value="50">50</option>
        <option value="100">100</option>
      </select>
    </div>
    <div id="structureSummary" class="dict-summary"></div>
    <div id="structureList" class="structure-list"></div>
  `);
}

function renderStructure(){
  const q=(document.getElementById("structureSearch")?.value||"").toLowerCase().trim();
  const g=document.getElementById("structureGroup")?.value||"";
  const lim=document.getElementById("structureLimit")?.value||"all";
  let arr=sourceStructure.filter(x=>{
    const hay=[x.fnc,x.mnemonic,x.name,x.function,x.syntax,x.kind].join(" ").toLowerCase();
    return (!q || hay.includes(q)) && (!g || x.kind===g);
  });
  const total=arr.length;
  if(lim!=="all") arr=arr.slice(0,Number(lim));
  const sum=document.getElementById("structureSummary");
  if(sum) sum.textContent=`Hiển thị ${arr.length} / ${total} mục`;
  const list=document.getElementById("structureList");
  if(!list) return;
  list.innerHTML=arr.map((x,i)=>`
    <article class="structure-card">
      <div class="structure-card-head">
        <div>
          <span class="structure-kind">${esc(x.kind)}</span>
          ${x.fnc?`<span class="structure-fnc">${esc(x.fnc)}</span>`:""}
          <h3>${esc(x.mnemonic)} <small>${esc(x.name)}</small></h3>
        </div>
        <span class="structure-page">PDF trang ${x.page}</span>
      </div>

      <div class="structure-grid">
        <div class="structure-info">
          <div class="structure-label">Cấu trúc trong tài liệu</div>
          <pre class="structure-code">${esc(x.syntax)}</pre>

          <div class="structure-label">Chức năng</div>
          <p>${esc(x.function)}</p>

          <div class="structure-label">Nguồn hình</div>
          <p>Hình được lấy trực tiếp từ bảng Instruction List trong PDF, trang ${x.page}.</p>
        </div>

        <figure class="structure-figure">
          <img src="${esc(x.image)}" loading="lazy" alt="Cấu trúc lệnh ${esc(x.mnemonic)} từ PDF">
          <figcaption>${esc(x.fnc||x.mnemonic)} — hình minh họa từ tài liệu</figcaption>
        </figure>
      </div>
    </article>
  `).join("") || `<div class="empty-state">Không tìm thấy lệnh phù hợp.</div>`;

}

function bindStructureFilters(){
  document.getElementById("structureSearch")?.addEventListener("input",renderStructure);
  document.getElementById("structureGroup")?.addEventListener("change",renderStructure);
  document.getElementById("structureLimit")?.addEventListener("change",renderStructure);
}

RST Y1</pre><p>Hãy xác định trạng thái Y0/Y1 cho từng tổ hợp input và giải thích vì sao SET khác OUT.</p></div>
`)
else if(page==="timers") html=layout("⏱ Timer & Counter",`
<div class="topic-hero"><h2>Timer & Counter</h2><p><b>Mục tiêu:</b> biết timer tạo trễ như thế nào, counter đếm như thế nào và cách reset/monitor chúng.</p></div>
<div class="learning-section"><h3>1. Timer</h3><p>Timer dùng để tạo điều kiện sau một khoảng thời gian. Khi rung cấp điều kiện cho timer, timer bắt đầu đếm theo time base của loại timer/model.</p>
${ladderLessonSvg("and","Timer: X0 → T0 → Y0")}
<pre class="code-box">LD X0
OUT T0 K50
LD T0
OUT Y0</pre>
<ol class="step-list"><li>X0 ON → T0 bắt đầu đếm.</li><li>K50 là preset; thời gian thực tế phụ thuộc time base của T0.</li><li>T0 hoàn tất → tiếp điểm T0 TRUE.</li><li>Y0 ON.</li></ol></div>
<div class="learning-section"><h3>2. Counter</h3>
<div class="lesson-image"><div class="lesson-image-title"><b>Counter</b><span>Xung → C0</span></div><svg viewBox="0 0 1100 240" class="lesson-svg"><rect width="1100" height="240" fill="#fff"/><text x="120" y="100" font-size="24">X0</text><path d="M190 90H380" stroke="#111" stroke-width="3"/><text x="410" y="100" font-size="24">C0 K5</text><path d="M590 90H770" stroke="#111" stroke-width="3"/><text x="800" y="100" font-size="24">Y0</text><text x="400" y="160" font-size="17">Đếm đủ 5 xung → C0 ON</text></svg></div>
<pre class="code-box">LD X0
OUT C0 K5

LD C0
OUT Y0

LD X1
RST C0</pre>
<ol class="step-list"><li>Mỗi sự kiện phù hợp tại X0 làm counter tăng theo cách counter hỗ trợ.</li><li>Đạt preset K5 → C0 TRUE.</li><li>C0 điều khiển Y0.</li><li>X1 reset C0.</li></ol></div>
<div class="learning-section"><h3>3. Lỗi thường gặp</h3><div class="error-box"><ul><li>Tính sai thời gian vì quên time base.</li><li>Không reset timer/counter đúng điều kiện.</li><li>Cho tín hiệu nhiễu vào counter mà không xử lý cạnh.</li><li>Dùng chung T/C cho nhiều mục đích.</li></ul></div></div>
<div class="practice-box"><b>Bài tập:</b> Nhấn X0 5 lần → Y0 sáng. Nhấn X1 → reset để hệ thống sẵn sàng đếm lại.</div>
`)
else if(page==="ladder") html=layout("🪜 Ladder Logic",`
<p>Ladder Logic là cách biểu diễn chương trình PLC giống mạch điều khiển relay. Phần này đi từ logic cơ bản đến các cấu trúc thường dùng khi lập trình máy.</p>
<div class="notice"><b>📌 Cách học:</b> đọc sơ đồ → xác định điều kiện ON/OFF → theo dõi PLC quét từ trên xuống dưới → kiểm tra device bằng Monitor.</div>

<div class="lesson">
 <div class="lesson-head"><h3>1. AND — Hai điều kiện phải cùng ON</h3><p>X0 và X1 cùng ON thì Y0 ON.</p></div>
 <div class="lesson-body">
  ${ladderLessonSvg("and","AND: X0 AND X1 → Y0")}
  <div class="lesson-grid">
   <div class="lesson-box"><b>X0</b><br>Nút/cảm biến thứ nhất. Phải ON để dòng logic đi qua.</div>
   <div class="lesson-box"><b>X1</b><br>Điều kiện thứ hai. Cũng phải ON.</div>
   <div class="lesson-box"><b>Y0</b><br>Output chỉ ON khi cả X0 và X1 đều ON.</div>
   <div class="lesson-box"><b>Logic</b><br><code>Y0 = X0 AND X1</code></div>
  </div>
  <h4>Chương trình Mitsubishi FX</h4>
  <pre class="lesson-code">LD X0
AND X1
OUT Y0</pre>
  <h4>Trình tự hoạt động</h4><ol><li>X0 OFF → Y0 OFF.</li><li>X0 ON nhưng X1 OFF → Y0 vẫn OFF.</li><li>X0 ON + X1 ON → Y0 ON.</li><li>Một trong hai OFF → Y0 OFF.</li></ol>
  <h4>Ứng dụng</h4><p>Hai điều kiện an toàn, cảm biến sản phẩm + điều kiện máy, Start + cho phép chạy...</p>
  <h4>Lỗi thường gặp</h4><p>Đấu nhầm tiếp điểm NO/NC hoặc nhầm AND với OR.</p>
 </div>
</div>

<div class="lesson">
 <div class="lesson-head"><h3>2. OR — Chỉ cần một điều kiện ON</h3><p>X0 hoặc X1 ON thì Y0 ON.</p></div>
 <div class="lesson-body">
  ${ladderLessonSvg("or","OR: X0 OR X1 → Y0")}
  <div class="lesson-grid"><div class="lesson-box"><b>Nhánh trên</b><br>X0 là một đường điều khiển.</div><div class="lesson-box"><b>Nhánh dưới</b><br>X1 là đường điều khiển thứ hai.</div><div class="lesson-box"><b>Y0</b><br>ON nếu ít nhất một nhánh đúng.</div><div class="lesson-box"><b>Logic</b><br><code>Y0 = X0 OR X1</code></div></div>
  <h4>Chương trình</h4><pre class="lesson-code">LD X0
OR X1
OUT Y0</pre>
  <h4>Trình tự</h4><ol><li>Cả hai OFF → Y0 OFF.</li><li>X0 ON → Y0 ON.</li><li>X0 OFF nhưng X1 ON → Y0 vẫn ON.</li><li>Cả hai OFF → Y0 OFF.</li></ol>
  <h4>Ứng dụng</h4><p>Điều khiển từ hai nút, hai cảm biến, hai điều kiện cho phép máy chạy.</p>
 </div>
</div>

<div class="lesson">
 <div class="lesson-head"><h3>3. Self-hold — Mạch tự giữ</h3><p>Nhấn START một lần, Y0 tiếp tục ON cho đến khi nhấn STOP.</p></div>
 <div class="lesson-body">
  ${ladderLessonSvg("hold","Self-hold: START + Y0 giữ + STOP")}
  <h4>Chương trình</h4><pre class="lesson-code">LDI X1
AND X0
OR Y0
OUT Y0</pre>
  <h4>Giải thích từng phần</h4><ol><li><b>X1 STOP</b> dùng tiếp điểm thường đóng: bình thường cho phép mạch chạy.</li><li><b>X0 START</b> là nút nhấn khởi động.</li><li><b>Y0</b> mắc song song X0 để tự giữ sau khi nhả START.</li><li>Khi X1 STOP tác động, mạch bị ngắt và Y0 OFF.</li></ol>
  <h4>Trình tự hoạt động</h4><ol><li>Ban đầu X1 chưa nhấn, Y0 OFF.</li><li>Nhấn X0 → Y0 ON.</li><li>Nhả X0 → tiếp điểm Y0 vẫn duy trì mạch → Y0 tiếp tục ON.</li><li>Nhấn X1 → mạch hở → Y0 OFF.</li></ol>
  <h4>Ứng dụng</h4><p>Motor, bơm, quạt, van điện, contactor và hầu hết mạch START/STOP.</p>
  <h4>Lỗi thường gặp</h4><p>Đặt tiếp điểm giữ sai vị trí hoặc có network khác ghi OUT Y0 làm Y0 bị tắt lại.</p>
 </div>
</div>

<div class="lesson">
 <div class="lesson-head"><h3>4. Interlock — Khóa chéo hai output</h3><p>Y0 và Y1 không được phép ON đồng thời.</p></div>
 <div class="lesson-body">
  ${ladderLessonSvg("interlock","Interlock: Y0 ↔ Y1")}
  <h4>Chương trình</h4><pre class="lesson-code">LD X0
ANI Y1
OUT Y0

LD X1
ANI Y0
OUT Y1</pre>
  <h4>Giải thích</h4><ol><li>X0 yêu cầu Y0 ON nhưng phải kiểm tra Y1 đang OFF.</li><li>X1 yêu cầu Y1 ON nhưng phải kiểm tra Y0 đang OFF.</li><li>Nếu Y0 đang ON thì nhánh Y1 bị khóa.</li><li>Nếu Y1 đang ON thì nhánh Y0 bị khóa.</li></ol>
  <h4>Ứng dụng</h4><p>Thuận/nghịch motor, nâng/hạ, mở/đóng van, hai contactor không được đóng cùng lúc.</p>
  <div class="notice"><b>⚠️ An toàn:</b> với contactor/motor đảo chiều, nên có cả interlock phần cứng; không chỉ dựa vào PLC.</div>
 </div>
</div>

<div class="lesson">
 <div class="lesson-head"><h3>5. Toggle — Mỗi lần nhấn đổi trạng thái</h3><p>Lần 1 ON, lần 2 OFF, lần 3 ON...</p></div>
 <div class="lesson-body">
  ${ladderLessonSvg("toggle","Toggle: mỗi lần nhấn đảo trạng thái")}
  <h4>Cách đơn giản trên Mitsubishi FX</h4><pre class="lesson-code">LD X0
ALT Y0</pre>
  <h4>Giải thích</h4><ol><li>PLC nhận một lần kích hoạt X0.</li><li>ALT đảo trạng thái của Y0.</li><li>Y0 OFF → ON.</li><li>Lần kích hoạt tiếp theo: Y0 ON → OFF.</li></ol>
  <h4>Điểm quan trọng</h4><p>Phải hiểu cơ chế kích hoạt của ALT để không làm Y0 đảo liên tục khi giữ nút. Nếu yêu cầu chống dội/phát hiện cạnh cụ thể, có thể dùng PLS/MEP kết hợp M bit.</p>
  <h4>Ứng dụng</h4><p>Nút bật/tắt đèn, chế độ Auto/Manual, bật/tắt chức năng trên HMI.</p>
 </div>
</div>

<div class="lesson">
 <div class="lesson-head"><h3>6. One-shot — Chỉ tạo xung một scan</h3><p>Nhấn/ON X0 → M0 chỉ ON trong một chu kỳ quét.</p></div>
 <div class="lesson-body">
  ${ladderLessonSvg("oneshot","One-shot: PLS M0")}
  <h4>Chương trình</h4><pre class="lesson-code">LD X0
PLS M0</pre>
  <h4>Giải thích</h4><ol><li>X0 chuyển OFF → ON.</li><li>PLS tạo xung tại M0.</li><li>M0 chỉ ON trong một scan.</li><li>Nếu X0 vẫn giữ ON, M0 không tiếp tục ON ở các scan sau.</li></ol>
  <h4>Ứng dụng</h4><p>Tăng counter một lần cho mỗi lần nhấn, trigger một chuỗi, ghi dữ liệu một lần, phát lệnh cho máy.</p>
  <h4>PLS khác giữ ON như thế nào?</h4><p>Tiếp điểm X0 có thể giữ ON nhiều scan, nhưng M0 sau PLS chỉ tạo một xung nên rất hữu ích khi cần xử lý sự kiện “một lần”.</p>
 </div>
</div>

<div class="lesson">
 <div class="lesson-head"><h3>7. Sequence — Chia máy thành các bước</h3><p>Dùng State Relay S + STL/RET để tổ chức máy theo từng trạng thái.</p></div>
 <div class="lesson-body">
  ${ladderLessonSvg("sequence","Sequence: S0 → S10 → S20 ...")}
  <h4>Ý tưởng</h4><p>Thay vì viết một network rất dài, chia máy thành các trạng thái: chờ → kẹp → chạy → nhả → kết thúc.</p>
  <h4>Ví dụ cơ bản</h4><pre class="lesson-code">LD X0
SET S10

STL S10
OUT Y0
LD X1
SET S20
RET

STL S20
OUT Y1
RET</pre>
  <h4>Giải thích từng bước</h4><ol><li><b>S0 / trạng thái ban đầu:</b> chờ điều kiện Start.</li><li><b>S10:</b> máy thực hiện công việc 1, ví dụ bật Y0.</li><li>Khi X1 xác nhận công việc 1 hoàn tất → chuyển sang S20.</li><li><b>S20:</b> thực hiện công việc 2, ví dụ bật Y1.</li><li>Có thể tiếp tục S30, S40... tùy quy trình.</li></ol>
  <h4>Ứng dụng</h4><p>Máy gắp đặt, máy ép, máy bơm, máy cấp phôi, máy dán keo, máy kiểm tra CCD...</p>
  <h4>Lợi ích</h4><p>Dễ đọc, dễ debug và dễ tìm xem máy đang đứng ở bước nào.</p>
 </div>
</div>

<ol><li>AND / OR</li><li>NO / NC và logic đảo</li><li>Self-hold</li><li>Interlock</li><li>Timer / Counter</li><li>One-shot</li><li>SET / RST</li><li>Toggle</li><li>Sequence với S + STL/RET</li><li>Sau đó mới đi sâu vào FNC, positioning, PID, communication.</li></ol>
`);

function commandDiagram(name,fnc,group,desc){
  const v=verifiedSyntax[name], syntax=v?v[0]:"";
  const explanation=v?v[1]:"Cú pháp operand của lệnh này chưa được tự dựng. Xem Instruction Format trong manual để tránh dùng sai cấu trúc.";
  const shown=syntax||("FNC "+String(fnc||"").replace("FNC","")+" "+name);
  return `<div class="command-diagram"><div class="command-diagram-head"><b>📐 Hình minh họa cấu trúc lệnh</b><span>${esc(fnc)} · ${esc(group||"PLC")}</span></div><svg viewBox="0 0 1100 250" class="command-svg"><rect width="1100" height="250" class="svg-bg"/><line x1="55" y1="35" x2="55" y2="180" class="svg-rail"/><line x1="1045" y1="35" x2="1045" y2="180" class="svg-rail"/><line x1="55" y1="105" x2="1045" y2="105" class="svg-wire"/><text x="78" y="58" class="svg-address">0000</text><text x="145" y="98" class="contact">| |</text><text x="150" y="135" class="device">X0</text><text x="410" y="98" class="block">${esc(shown)}</text><text x="550" y="190" text-anchor="middle" class="svg-desc">${esc(explanation)}</text><text x="550" y="220" text-anchor="middle" class="svg-code">${esc(syntax||"X0 → instruction")}</text></svg></div>`;
}

function autoLadderImage(name, fnc, group, desc){
  const n=String(name||"").toUpperCase();
  let op=n, left="X0", mode="instruction";
  if(["CJ","CALL","SRET","IRET","EI","DI","FEND","WDT","FOR","NEXT"].includes(n)) mode="flow";
  else if(["CMP","ZCP","ECMP","EZCP","LD=","LD>","LD<","LD<>","LD<=","LD>=","AND=","AND>","AND<","AND<>","AND<=","AND>=","OR=","OR>","OR<","OR<>","OR<=","OR>="].includes(n)) mode="compare";
  else if(["ADD","SUB","MUL","DIV","INC","DEC","WAND","WOR","WXOR","NEG","EADD","ESUB","EMUL","EDIV","ESQR","ENEG"].includes(n)) mode="math";
  else if(["MOV","SMOV","CML","BMOV","FMOV","XCH","EMOV"].includes(n)) mode="move";
  else if(["ROR","ROL","RCR","RCL","SFTR","SFTL","WSFR","WSFL","SFWR","SFRD","SFR","SFL"].includes(n)) mode="shift";
  else if(["PLSY","PWM","PLSR","HSCS","HSCR","HSZ","SPD","DSZR","DVIT","TBL","ABS","ZRN","PLSV","DRVI","DRVA"].includes(n)) mode="motion";
  else if(["TCMP","TZCP","TADD","TSUB","HTOS","STOH","TRD","TWR","HOUR"].includes(n)) mode="rtc";
  else if(["STR","VAL","$+","LEN","RIGHT","LEFT","MIDR","MIDW","INSTR","$MOV","ASCI","HEX","CCD"].includes(n)) mode="string";
  else if(["PID"].includes(n)) mode="pid";
  else mode="applied";

  let lines="", code="", note="";
  if(mode==="flow"){
    lines=`<text x="145" y="98" class="contact">| |</text><text x="150" y="132" class="device">X0</text><text x="420" y="98" class="block">${esc(op)} ...</text>`;
    code=`${op} ...`; note="Instruction điều khiển luồng chương trình.";
  }else if(mode==="compare"){
    lines=`<text x="145" y="98" class="contact">| |</text><text x="150" y="132" class="device">X0</text><text x="420" y="98" class="block">${esc(op)} D0 K100 M0</text>`;
    code=`${op} D0 K100 M0`; note="Instruction xử lý điều kiện so sánh dữ liệu.";
  }else if(mode==="math"){
    lines=`<text x="145" y="98" class="contact">| |</text><text x="150" y="132" class="device">X0</text><text x="420" y="98" class="block">${esc(op)} D0 K10 D10</text>`;
    code=`${op} D0 K10 D10`; note="Instruction xử lý dữ liệu số.";
  }else if(mode==="move"){
    lines=`<text x="145" y="98" class="contact">| |</text><text x="150" y="132" class="device">X0</text><text x="420" y="98" class="block">${esc(op)} D0 D10</text>`;
    code=`${op} D0 D10`; note="Instruction truyền/chuyển đổi dữ liệu.";
  }else if(mode==="shift"){
    lines=`<text x="145" y="98" class="contact">| |</text><text x="150" y="132" class="device">X0</text><text x="420" y="98" class="block">${esc(op)} M0 K4</text>`;
    code=`${op} M0 K4`; note="Instruction thao tác bit/word theo hướng dịch.";
  }else if(mode==="motion"){
    lines=`<text x="145" y="98" class="contact">| |</text><text x="150" y="132" class="device">M0</text><text x="420" y="98" class="block">${esc(op)} K1000 K500 Y0</text>`;
    code=`${op} K1000 K500 Y0`; note="Instruction liên quan xử lý tốc độ cao/chuyển động.";
  }else if(mode==="rtc"){
    lines=`<text x="145" y="98" class="contact">| |</text><text x="150" y="132" class="device">M8000</text><text x="420" y="98" class="block">${esc(op)} D0 D10</text>`;
    code=`${op} D0 D10`; note="Instruction xử lý dữ liệu thời gian thực.";
  }else if(mode==="string"){
    lines=`<text x="145" y="98" class="contact">| |</text><text x="150" y="132" class="device">M0</text><text x="420" y="98" class="block">${esc(op)} D0 D10</text>`;
    code=`${op} D0 D10`; note="Instruction xử lý dữ liệu ký tự/chuỗi.";
  }else if(mode==="pid"){
    lines=`<text x="145" y="98" class="contact">| |</text><text x="150" y="132" class="device">M100</text><text x="420" y="98" class="block">PID D0 D100 D200</text>`;
    code=`PID D0 D100 D200`; note="Instruction điều khiển PID.";
  }else{
    lines=`<text x="145" y="98" class="contact">| |</text><text x="150" y="132" class="device">X0</text><text x="420" y="98" class="block">${esc(op)} ...</text>`;
    code=`${op} ...`; note="Ví dụ minh họa cách gọi instruction trong một rung Ladder.";
  }

  return `<div class="ladder-shot">
    <div class="ladder-shot-title"><span>GX Works2 — Ladder</span><span>${esc(fnc)} / ${esc(name)}</span></div>
    <svg class="ladder-svg" viewBox="0 0 1100 210" role="img" aria-label="${esc(name)} Ladder">
      <rect x="0" y="0" width="1100" height="210" rx="8" class="gx-bg"/>
      <line x1="55" y1="35" x2="55" y2="175" class="rail"/>
      <line x1="1045" y1="35" x2="1045" y2="175" class="rail"/>
      <line x1="55" y1="105" x2="1045" y2="105" class="wire"/>
      <text x="78" y="58" class="addr">0000</text>
      ${lines}
      <text x="550" y="190" text-anchor="middle" class="caption">${esc(code)} — ${esc(note)}</text>
    </svg>
  </div>`;
}

function openInstruction(key){
  const item=manualCatalog.find(a=>a[0]===key||a[1]===key);
  if(item) show("catalog-"+encodeURIComponent(item[0]));
}
